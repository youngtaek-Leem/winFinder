[workspace]
resolver = "3"
members = ["crates/core", "crates/preview", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
image = "0.25"
chardetng = "1"
encoding_rs = "0.8"
pdfium-render = "0.9"
open = "5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
