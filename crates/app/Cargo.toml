[package]
name = "winfinder-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "winFinder"
path = "src/main.rs"

[dependencies]
winfinder-core = { path = "../core" }
winfinder-preview = { path = "../preview" }
winfinder-shell = { path = "../shell" }
eframe = { version = "0.37", default-features = false, features = [
    "glow",
    "wgpu",
    "default_fonts",
    "clipboard",
    "links",
] }
egui_commonmark = "0.26"
rodio = { version = "0.23", default-features = false, features = [
    "playback",
    "flac",
    "mp3",
    "vorbis",
    "wav",
] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
open.workspace = true
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }
